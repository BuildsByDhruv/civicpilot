services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicpilot-db
    environment:
      POSTGRES_DB: civicpilot
      POSTGRES_USER: civicpilot
      POSTGRES_PASSWORD: civicpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: